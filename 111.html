    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .bg-ssg-gradient { background: linear-gradient(135deg, #FF1E27 0%, #E60000 100%); }
        .bg-kia-gradient { background: linear-gradient(135deg, #111111 0%, #EA0029 100%); }
        .bg-samsung-gradient { background: linear-gradient(135deg, #074CA1 0%, #002C6C 100%); }
        .bg-lg-gradient { background: linear-gradient(135deg, #800020 0%, #111111 100%); }
        .bg-doosan-gradient { background: linear-gradient(135deg, #0B162C 0%, #131230 100%); }
        .bg-kt-gradient { background: linear-gradient(135deg, #121212 0%, #2B2B2B 100%); }
        .bg-lotte-gradient { background: linear-gradient(135deg, #041E42 0%, #D0021B 100%); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="bg-zinc-50 text-zinc-800 min-h-screen font-sans flex flex-col justify-between antialiased">

    <header class="bg-white border-b border-zinc-200 sticky top-0 z-30 shadow-sm">

            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-zinc-950 text-white flex items-center justify-center font-black text-xl shadow">
                    ⚾
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-zinc-900">KBO 프로야구 선수단 대시보드</h1>
                    <p class="text-xs text-zinc-500 font-medium">구단별 공식 24인 정원 로스터 대시보드</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="exportToCSV()" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 transition">
                    <i class="fa-solid fa-download"></i>
                    <span>CSV 내보내기</span>
                </button>
                <label class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 cursor-pointer transition">
                    <i class="fa-solid fa-upload"></i>
                    <span>CSV 불러오기</span>
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="importFromCSV(event)">
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
        <!-- 구단 선택 슬라이더 탭 -->
        <div class="relative mb-8">
            <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-2 pt-1 px-1" id="teamTabs"></div>
        </div>

        <!-- 구단 대표 배너 -->
        <div id="teamBanner" class="mb-8 rounded-2xl p-6 text-white shadow-lg transition-all duration-300 relative overflow-hidden">
            <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <span id="bannerSubtitle" class="text-xs font-extrabold uppercase tracking-widest opacity-90 px-2.5 py-1 rounded-full bg-black/30 border border-white/10 inline-block mb-2">SSG LANDERS</span>
                    <h2 id="bannerTitle" class="text-3xl font-black tracking-tight">SSG 랜더스</h2>
                    <p id="bannerDesc" class="text-sm opacity-90 mt-1">인천 SSG 랜더스필드 | KBO 리그 공식 선수단 (24명)</p>
                </div>
                <div class="flex items-center gap-4 bg-black/20 backdrop-blur-md rounded-xl p-3 border border-white/10 self-start md:self-auto">
                    <div class="text-center px-3">
                        <span class="block text-xs opacity-80 font-medium">등록 선수</span>
                        <span id="playerCount" class="text-2xl font-black">24명</span>
                    </div>
                    <div class="w-px h-8 bg-white/20"></div>
                    <div class="text-center px-3">
                        <span class="block text-xs opacity-80 font-medium">정렬 기준</span>
                        <span class="text-sm font-bold">등번호 순 (오름차순)</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 선수 카드 그리드 -->
        <div id="playerGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    </main>

    <!-- 선수 상세 정보 모달 -->
    <div id="playerModal" class="fixed inset-0 bg-zinc-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl transform transition-all border border-zinc-100">
            <div id="modalHeader" class="p-6 text-white relative">
                <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/35 hover:bg-black/50 flex items-center justify-center text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="flex items-center gap-4">
                    <div id="modalNumberBadge" class="w-16 h-16 rounded-2xl text-white font-black text-2xl flex items-center justify-center shadow-lg border border-white/30">
                        0
                    </div>
                    <div>
                        <span id="modalTeamName" class="text-xs font-bold uppercase tracking-wider opacity-90 block">SSG LANDERS</span>
                        <h3 id="modalPlayerName" class="text-2xl font-black">선수명</h3>
                        <span id="modalPosition" class="inline-block mt-1 px-2.5 py-0.5 rounded-md bg-white/20 text-xs font-semibold backdrop-blur-sm">포지션</span>
                    </div>
                </div>
            </div>

            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div class="bg-zinc-50 p-3 rounded-xl border border-zinc-100">
                        <span class="text-xs text-zinc-400 font-medium block">신체 스펙</span>
                        <span id="modalPhysical" class="font-bold text-zinc-800">-</span>
                    </div>
                    <div class="bg-zinc-50 p-3 rounded-xl border border-zinc-100">
                        <span class="text-xs text-zinc-400 font-medium block">등번호</span>
                        <span id="modalNumberDetail" class="font-bold text-zinc-800">No. 0</span>
                    </div>
                </div>

                    <p id="modalSchool" class="text-sm font-semibold text-zinc-800">-</p>
                </div>

                const tab = document.getElementById(`tab-${key}`);
                if (key === teamKey) {
                    tab.className = 'flex-shrink-0 flex items-center gap-2 px-5 py-3 rounded-xl font-extrabold text-sm transition shadow-sm bg-zinc-950 text-white border-zinc-950 scale-105 z-10';
                } else {
                    tab.className = 'flex-shrink-0 flex items-center gap-2 px-5 py-3 rounded-xl font-extrabold text-sm transition shadow-sm bg-white text-zinc-600 hover:bg-zinc-100 border-zinc-200';
                }
            });

            const banner = document.getElementById('teamBanner');
            banner.className = `mb-8 rounded-2xl p-6 text-white shadow-lg transition-all duration-300 relative overflow-hidden ${team.headerBgClass}`;
            document.getElementById('bannerSubtitle').innerText = team.englishName;
            document.getElementById('bannerTitle').innerText = team.name;
            document.getElementById('bannerDesc').innerText = team.desc;
            document.getElementById('playerCount').innerText = `${rosters[teamKey].length}명`;

            renderPlayers();
        }

        function renderPlayers() {
            const grid = document.getElementById('playerGrid');
            const team = TEAMS[currentTeamKey];

            grid.innerHTML = '';

            let playerList = [...rosters[currentTeamKey]];
            playerList.sort((a, b) => a.number - b.number);

            playerList.forEach(player => {
                const card = document.createElement('div');
                card.onclick = () => openModal(player);
                card.className = `bg-white rounded-2xl border border-zinc-200 overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer group flex flex-col justify-between ${team.borderHoverClass}`;

                card.innerHTML = `
                    <div>
                        <div class="h-24 ${team.headerBgClass} relative p-4 flex justify-between items-start">
                            <span class="text-xs font-bold text-white/80 uppercase tracking-wider">${team.englishName}</span>
                            
                            <div class="w-12 h-12 rounded-xl ${team.badgeBg} text-white font-black text-xl flex items-center justify-center shadow-lg border border-white/30 group-hover:scale-110 transition">
                                ${player.number}
                            </div>
                        </div>

                        <div class="p-4 pt-3 space-y-2">
                            <div class="flex items-center justify-between">
                                <h3 class="text-lg font-black text-zinc-900 group-hover:text-zinc-700 transition">${player.name}</h3>
                                <span class="text-xs font-extrabold px-2.5 py-1 rounded-md bg-zinc-100 text-zinc-700 border border-zinc-200">
                                    ${player.position}
                                </span>
                            </div>
                            
                            <div class="text-xs text-zinc-500 space-y-1 pt-1 border-t border-zinc-100">
                                <p><span class="text-zinc-400 font-medium">체격:</span> ${player.height} / ${player.weight}</p>
                                <p class="truncate"><span class="text-zinc-400 font-medium">학력:</span> ${player.school}</p>
                            </div>
                        </div>
                    </div>

                    <div class="px-4 py-2.5 bg-zinc-50 border-t border-zinc-100 text-xs text-zinc-500 font-medium flex items-center justify-between">
                        <span>상세 프로필 보기</span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-zinc-400 group-hover:translate-x-1 transition"></i>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function openModal(player) {
            const team = TEAMS[currentTeamKey];
            const modal = document.getElementById('playerModal');
            
            document.getElementById('modalHeader').className = `p-6 text-white relative ${team.headerBgClass}`;
            
            const modalBadge = document.getElementById('modalNumberBadge');
            modalBadge.className = `w-16 h-16 rounded-2xl ${team.badgeBg} text-white font-black text-2xl flex items-center justify-center shadow-lg border border-white/30`;
            modalBadge.innerText = player.number;

            document.getElementById('modalTeamName').innerText = team.englishName;
            document.getElementById('modalPlayerName').innerText = player.name;
            document.getElementById('modalPosition').innerText = player.position;

            document.getElementById('modalPhysical').innerText = `${player.height} / ${player.weight}`;
            document.getElementById('modalNumberDetail').innerText = `No. ${player.number}`;
            document.getElementById('modalSchool').innerText = player.school;
            document.getElementById('modalTransfer').innerText = player.transfer;

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('playerModal').classList.add('hidden');
        }

        function exportToCSV() {
            let csvContent = "\uFEFF팀,등번호,선수명,포지션,신장,체중,학력,이적조건\n";
            Object.keys(rosters).forEach(teamKey => {
                const teamName = TEAMS[teamKey].name;
                rosters[teamKey].forEach(p => {
                    csvContent += `"${teamName}",${p.number},"${p.name}","${p.position}","${p.height}","${p.weight}","${p.school}","${p.transfer}"\n`;
                });
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `KBO_통합구단_상세로스터_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function importFromCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                
                lines.forEach((line, index) => {
                    if (index === 0 || !line.trim()) return;
                    const cols = line.split(',').map(c => c.replace(/"/g, '').trim());
                    if (cols.length >= 8) {
                        const [teamName, numStr, name, position, height, weight, school, transfer] = cols;
                        const number = parseInt(numStr, 10);
                        
                        let teamKey = Object.keys(TEAMS).find(k => TEAMS[k].name === teamName || TEAMS[k].englishName === teamName);
                        if (teamKey && !isNaN(number) && name) {
                            const existingIndex = rosters[teamKey].findIndex(p => p.number === number);
                            const playerData = { number, name, position, height, weight, school, transfer };
                            if (existingIndex >= 0) {
                                rosters[teamKey][existingIndex] = playerData;
                            } else {
                                rosters[teamKey].push(playerData);
                            }
                        }
                    }
                });

                sortAllRosters();
                renderPlayers();
                alert('CSV 데이터가 성공적으로 반영되었습니다.');
            };
            reader.readAsText(file);
        }
    </script>
